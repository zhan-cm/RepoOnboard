name: Release verification

on:
  push:
    branches:
      - master
    tags:
      - v0.1.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-smoke:
    name: ${{ matrix.os }} smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean build and packaged offline analysis (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd clean verify

      - name: Clean build and packaged offline analysis (POSIX)
        if: runner.os != 'Windows'
        run: ./mvnw clean verify

      - name: Verify Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = .\repoonboard.cmd --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne 'RepoOnboard 0.1.0') {
            throw "Unexpected launcher result: $actual"
          }

      - name: Verify POSIX launcher
        if: runner.os != 'Windows'
        run: test "$(./repoonboard --version)" = "RepoOnboard 0.1.0"

  publish-release:
    name: Publish GitHub release
    if: github.ref == 'refs/tags/v0.1.0'
    needs: cross-platform-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release artifacts
        run: ./mvnw clean verify

      - name: Assemble release archive
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/repoonboard-0.1.0"
          mkdir -p "$release_dir"
          cp target/repoonboard.jar target/repoonboard.jar.sha256 "$release_dir/"
          cp repoonboard repoonboard.cmd README.md README.zh-CN.md LICENSE NOTICE THIRD_PARTY_NOTICES.md "$release_dir/"
          cp -R third-party-licenses "$release_dir/"
          chmod +x "$release_dir/repoonboard"
          (cd target && zip -qr repoonboard-0.1.0.zip repoonboard-0.1.0)
          (cd target && sha256sum repoonboard-0.1.0.zip > repoonboard-0.1.0.zip.sha256)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.1.0
          target/repoonboard-0.1.0.zip
          target/repoonboard-0.1.0.zip.sha256
          target/repoonboard.jar
          target/repoonboard.jar.sha256
          --verify-tag
          --title "RepoOnboard V0.1.0"
          --notes-file docs/releases/v0.1.0.md
